version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: fund_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${DB_NAME:-fund_data}
      MYSQL_USER: ${DB_USER:-fund_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  scraper:
    build: .
    container_name: fund_etl_app
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./validation_output:/app/validation_output
    tty: true

volumes:
  mysql_data:
